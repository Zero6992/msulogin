<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MapleN 快速啟動</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230e1013'/%3E%3Cpath d='M50 5C50 5 46 19 46 21 46 23 43 25 40 23L31 18 35 31C36 34 34 35 32 34L23 31 27 41C28 44 26 45 24 45L11 45 19 53C21 55 20 57 18 58L9 63 38 69C40 69 41 71 40 73L37 85 48 81C50 80 51 81 51 83L50 97 54 97 53 83C53 81 54 80 56 81L67 85 64 73C63 71 64 69 66 69L95 63L86 58C84 57 83 55 85 53L93 45 80 45C78 45 76 44 77 41L81 31 72 34C70 35 68 34 69 31L73 18L64 23C61 25 58 23 58 21 58 19 54 5 54 5Z' fill='%237ee0bf'/%3E%3Cg transform='translate(50 55) scale(.7) translate(-50 -50)'%3E%3Cpath d='M58 8 24 56 45 56 40 92 76 42 54 42Z' fill='%230e1013'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #0e1013;
    --bg-elev:   #15181d;
    --bg-input:  #1b1f26;
    --line:      #262b33;
    --line-soft: #1f242b;
    --text:      #e7e9ec;
    --text-dim:  #9aa1ac;
    --text-mute: #5c6470;
    --accent:    #7ee0bf;
    --accent-ink:#0d2820;
    --danger:    #f0a4a4;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(126,224,191,0.06), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(126,224,191,0.04), transparent 60%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }
  .shell{
    width:100%;
    max-width:560px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
    color:var(--text-dim);
    font-size:13px;
    letter-spacing:0.02em;
  }
  .brand .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px rgba(126,224,191,0.55);
  }
  .card{
    background:linear-gradient(180deg, #15181d 0%, #121519 100%);
    border:1px solid var(--line-soft);
    border-radius:18px;
    padding:32px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.02) inset,
      0 30px 60px -30px rgba(0,0,0,0.7);
  }
  h1{
    margin:0 0 6px;
    font-size:22px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .sub{
    margin:0 0 28px;
    color:var(--text-dim);
    font-size:13.5px;
    line-height:1.6;
  }
  .sub code{
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:12px;
    background:#1d2128;
    padding:1px 6px;
    border-radius:5px;
    color:#cfe7dd;
  }

  .step{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:14px;
  }
  .step-num{
    flex:0 0 auto;
    width:26px;height:26px;
    border-radius:50%;
    background:#1d222a;
    color:var(--text-dim);
    font-size:12.5px;
    font-weight:600;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
  }
  .step.active .step-num{
    background:var(--accent);
    color:var(--accent-ink);
    border-color:transparent;
  }
  .step.done .step-num{
    background:#1d2a25;
    color:var(--accent);
    border-color:#274136;
  }
  .step-label{
    font-size:13.5px;
    color:var(--text-dim);
    letter-spacing:0.01em;
  }
  .step.active .step-label,
  .step.done .step-label{ color:var(--text); }

  .row{ display:flex; gap:10px; align-items:stretch; }

  .btn{
    appearance:none;
    border:1px solid var(--line);
    background:#1a1e25;
    color:var(--text);
    font: 500 13.5px/1 "Inter","Noto Sans TC",sans-serif;
    padding:11px 16px;
    border-radius:10px;
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease, transform .05s ease, color .15s ease;
    display:inline-flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
  }
  .btn:hover{ background:#1f242c; border-color:#323943; }
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn .ic{ width:14px;height:14px; }

  .btn-primary{
    background:var(--accent);
    color:var(--accent-ink);
    border-color:transparent;
    font-weight:600;
  }
  .btn-primary:hover{ background:#92e8c9; }
  .btn-primary:disabled{ background:#2a4239; color:#6f9d8b; }

  .btn-block{ flex:1; justify-content:center; }

  .wallet{
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    background:#14181e;
    border:1px solid var(--line-soft);
    border-radius:10px;
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:12.5px;
    color:var(--text-dim);
    min-height:42px;
    overflow:hidden;
  }
  .wallet.connected{ color:var(--text); }
  .wallet .live{
    width:7px;height:7px;border-radius:50%;
    background:#3a414a;
    flex:0 0 auto;
  }
  .wallet.connected .live{
    background:var(--accent);
    box-shadow:0 0 8px rgba(126,224,191,0.6);
  }

  .output-label{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin: 26px 0 8px;
  }
  .output-label .lbl{
    font-size:12.5px;
    color:var(--text-dim);
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .output-label .hint{
    font-size:12px;
    color:var(--text-mute);
  }

  .output{
    position:relative;
    border:1px solid var(--line-soft);
    background:#10131a;
    border-radius:12px;
    padding:14px 56px 14px 16px;
    min-height:74px;
    display:flex;
    align-items:center;
    transition:border-color .2s ease, background .2s ease;
  }
  .output.has-value{
    border-color:#2a3a35;
    background:#101714;
  }
  .output textarea{
    flex:1;
    background:transparent;
    border:0;
    outline:0;
    resize:none;
    color:var(--text);
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:13px;
    line-height:1.55;
    width:100%;
    min-height:42px;
    word-break:break-all;
    padding:0;
  }
  .output textarea::placeholder{ color:var(--text-mute); }
  .output textarea::selection{ background:rgba(126,224,191,0.25); }

  .copy-btn{
    position:absolute;
    top:10px;
    right:10px;
    width:34px;height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#181c23;
    color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition: all .15s ease;
  }
  .copy-btn:hover{ color:var(--text); border-color:#323943; background:#1d222a; }
  .copy-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .copy-btn.copied{
    color:var(--accent-ink);
    background:var(--accent);
    border-color:transparent;
  }
  .copy-btn svg{ width:15px;height:15px; }

  .toast{
    position:fixed;
    left:50%;
    bottom:32px;
    transform:translateX(-50%) translateY(20px);
    background:#1a1e25;
    color:var(--text);
    border:1px solid var(--line);
    padding:10px 16px;
    border-radius:10px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition: all .2s ease;
    box-shadow: 0 12px 30px -10px rgba(0,0,0,0.7);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast .ic{ color:var(--accent); margin-right:6px; }
  .toast.error .ic{ color:var(--danger); }

  .footnote{
    margin-top:18px;
    font-size:12px;
    color:var(--text-mute);
    text-align:center;
    letter-spacing:0.01em;
  }

  .card{
    animation: rise .5s ease both;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:none; }
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width:480px){
    .card{ padding:24px 20px; border-radius:14px; }
    h1{ font-size:19px; }
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <span class="dot"></span>
      <span>MapleStory&nbsp;N · Wallet Bridge</span>
    </div>

    <div class="card">
      <h1>臨時啟動網址</h1>
      <p class="sub">連接 MetaMask、簽名後產生 <code>msul://</code> 啟動指令，貼入瀏覽器即可開啟遊戲。</p>

      <div class="step" id="step1">
        <div class="step-num">1</div>
        <div class="step-label">連接錢包</div>
      </div>
      <div class="row" style="margin-bottom:22px;">
        <button class="btn btn-primary" id="connectBtn">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h2"/><path d="M3 9h13a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H3"/></svg>
          <span id="connectLabel">連接 MetaMask</span>
        </button>
        <div class="wallet" id="walletPill">
          <span class="live"></span>
          <span id="walletText">尚未連接</span>
        </div>
      </div>

      <div class="step" id="step2">
        <div class="step-num">2</div>
        <div class="step-label">產生登入網址</div>
      </div>
      <div class="row">
        <button class="btn btn-primary btn-block" id="generateBtn" disabled>
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
          產生登入網址
        </button>
      </div>

      <div class="output-label">
        <span class="lbl">啟動指令</span>
        <span class="hint" id="outputHint">尚未產生</span>
      </div>
      <div class="output" id="outputBox">
        <textarea id="outputText" readonly placeholder="msul://… 將在這裡出現"></textarea>
        <button class="copy-btn" id="copyBtn" disabled aria-label="複製">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>

      <p class="footnote">複製後，將指令貼入瀏覽器網址列即可啟動 MapleStory&nbsp;N。</p>
    </div>
  </div>

  <div class="toast" id="toast">
    <span class="ic">✓</span><span id="toastText">已複製到剪貼簿</span>
  </div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const connectBtn = $('connectBtn');
  const connectLabel = $('connectLabel');
  const walletPill = $('walletPill');
  const walletText = $('walletText');
  const step1 = $('step1');
  const step2 = $('step2');
  const generateBtn = $('generateBtn');
  const outputBox = $('outputBox');
  const outputText = $('outputText');
  const outputHint = $('outputHint');
  const copyBtn = $('copyBtn');
  const toast = $('toast');
  const toastIc = toast.querySelector('.ic');
  const toastText = $('toastText');

  const COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

  let connectedAddress = null;
  let running = false;

  function showToast(msg, kind){
    toastText.textContent = msg;
    toast.classList.toggle('error', kind === 'error');
    toastIc.textContent = kind === 'error' ? '✕' : '✓';
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toast.classList.remove('show'), 2200);
  }

  function shortAddr(a){
    return a.slice(0,6) + '…' + a.slice(-4);
  }

  function utf8ToHex(message){
    const bytes = new TextEncoder().encode(message);
    let hex = '0x';
    for (const b of bytes) hex += b.toString(16).padStart(2, '0');
    return hex;
  }

  async function signMessage(message){
    if (!window.ethereum){
      throw new Error('找不到 MetaMask，請先安裝並解鎖。');
    }
    return window.ethereum.request({
      method: 'personal_sign',
      params: [utf8ToHex(message), connectedAddress]
    });
  }

  async function apiLaunch(payload){
    const res = await fetch('/api/launch', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(payload)
    });
    let data;
    try { data = await res.json(); }
    catch { throw new Error(`伺服器回傳非 JSON (${res.status})`); }
    if (!res.ok || !data.success){
      throw new Error(data.error || `Request failed (${res.status})`);
    }
    return data;
  }

  function setStepState(connected, generated){
    step1.classList.toggle('active', !connected);
    step1.classList.toggle('done', connected);
    step2.classList.toggle('active', connected && !generated);
    step2.classList.toggle('done', generated);
  }

  connectBtn.addEventListener('click', async ()=>{
    if (running) return;
    connectBtn.disabled = true;
    const oldLabel = connectLabel.textContent;
    connectLabel.textContent = '連接中…';

    try {
      if (!window.ethereum || !window.ethereum.request){
        throw new Error('找不到 MetaMask');
      }
      const accounts = await window.ethereum.request({ method:'eth_requestAccounts' });
      const address = accounts && accounts[0];
      if (!address) throw new Error('沒有可用帳號');

      connectedAddress = address;
      walletPill.classList.add('connected');
      walletText.textContent = shortAddr(address);
      connectLabel.textContent = '重新連接';
      generateBtn.disabled = false;
      // reset output if reconnecting
      outputText.value = '';
      outputBox.classList.remove('has-value');
      outputHint.textContent = '尚未產生';
      copyBtn.disabled = true;
      setStepState(true, false);
    } catch (e){
      connectLabel.textContent = oldLabel;
      showToast(`連接失敗：${e.message || '請再試一次'}`, 'error');
    } finally {
      connectBtn.disabled = false;
    }
  });

  generateBtn.addEventListener('click', async ()=>{
    if (!connectedAddress || running) return;
    running = true;
    generateBtn.disabled = true;
    connectBtn.disabled = true;
    const inner = generateBtn.innerHTML;
    generateBtn.innerHTML = '<span style="display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite"></span> 處理中…';
    outputHint.textContent = '處理中…';

    try {
      // Step 1: web message
      const s1 = await apiLaunch({ step:1, address: connectedAddress });

      // First MetaMask signature
      generateBtn.innerHTML = '<span style="display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite"></span> 簽名 1/2…';
      outputHint.textContent = '請在 MetaMask 簽第一段訊息';
      const signature1 = await signMessage(s1.message);

      // Step 2: signin-wallet
      generateBtn.innerHTML = '<span style="display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite"></span> 處理中…';
      outputHint.textContent = '驗證中…';
      const s2 = await apiLaunch({ step:2, address: connectedAddress, signature1 });
      if (s2.step2_error && !s2.has_jwt && !s2.has_auth_jwt){
        throw new Error(s2.step2_error_detail || '登入失敗');
      }

      // Step 3: game message
      const s3 = await apiLaunch({ step:3, address: connectedAddress });

      // Second MetaMask signature
      generateBtn.innerHTML = '<span style="display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite"></span> 簽名 2/2…';
      outputHint.textContent = '請在 MetaMask 簽第二段訊息';
      const signature2 = await signMessage(s3.message);

      // Step 4: webtogame
      generateBtn.innerHTML = '<span style="display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite"></span> 取得 token…';
      outputHint.textContent = '取得 token…';
      const s4 = await apiLaunch({ step:4, address: connectedAddress, signature2 });

      outputText.value = s4.command;
      outputBox.classList.add('has-value');
      outputHint.textContent = '已產生 · 點右側按鈕複製';
      copyBtn.disabled = false;
      setStepState(true, true);
      showToast('啟動指令已產生');
    } catch (e){
      outputHint.textContent = '產生失敗';
      showToast(`失敗：${e.message || '未知錯誤'}`, 'error');
    } finally {
      generateBtn.innerHTML = inner;
      generateBtn.disabled = false;
      connectBtn.disabled = false;
      running = false;
    }
  });

  copyBtn.addEventListener('click', async ()=>{
    if (!outputText.value) return;
    try{
      await navigator.clipboard.writeText(outputText.value);
    } catch {
      outputText.select();
      document.execCommand('copy');
    }
    copyBtn.classList.add('copied');
    copyBtn.innerHTML = CHECK_SVG;
    showToast('已複製到剪貼簿');
    setTimeout(()=>{
      copyBtn.classList.remove('copied');
      copyBtn.innerHTML = COPY_SVG;
    }, 1600);
  });

  // Track MetaMask account changes
  if (window.ethereum && window.ethereum.on){
    window.ethereum.on('accountsChanged', (accounts)=>{
      const next = accounts && accounts[0];
      if (next){
        connectedAddress = next;
        walletPill.classList.add('connected');
        walletText.textContent = shortAddr(next);
        generateBtn.disabled = running;
        outputText.value = '';
        outputBox.classList.remove('has-value');
        outputHint.textContent = '尚未產生';
        copyBtn.disabled = true;
        setStepState(true, false);
        showToast(`已切換帳號：${shortAddr(next)}`);
      } else {
        connectedAddress = null;
        walletPill.classList.remove('connected');
        walletText.textContent = '尚未連接';
        connectLabel.textContent = '連接 MetaMask';
        generateBtn.disabled = true;
        outputText.value = '';
        outputBox.classList.remove('has-value');
        outputHint.textContent = '尚未產生';
        copyBtn.disabled = true;
        setStepState(false, false);
      }
    });
  }

  // initial state
  setStepState(false, false);
})();
</script>
</body>
</html>
